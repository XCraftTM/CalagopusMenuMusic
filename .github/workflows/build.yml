name: Build Extension

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IDENTIFIER: dev_xcrafttm_menumusic

jobs:
  package:
    name: Package .c7s.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Build archive
        run: python3 scripts/package.py

      # archive: false uploads the .c7s.zip as-is, so the download is the
      # installable extension instead of a zip wrapped around it
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.IDENTIFIER }}.c7s.zip
          archive: false
          if-no-files-found: error

  release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.IDENTIFIER }}.c7s.zip
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.IDENTIFIER }}.c7s.zip
          generate_release_notes: true
